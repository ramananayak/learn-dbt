version: 2

models:
  - name: fct_revenue_v1
    description: "DEPRECATED v1 — use fct_revenue_v2. Will be removed after 2026-10-01."
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: revenue_key
        data_type: varchar
        constraints: [{type: not_null}, {type: primary_key}]
        tests: [not_null, unique]
      - name: customer_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: transaction_date
        data_type: date
        constraints: [{type: not_null}]
      - name: transaction_count
        data_type: bigint
        constraints: [{type: not_null}]
      - name: gross_revenue_usd
        data_type: double
        constraints: [{type: not_null}]
      - name: refund_amount_usd
        data_type: double
        constraints: [{type: not_null}]
      - name: net_revenue_usd
        data_type: double
        constraints: [{type: not_null}]
      - name: last_updated_at
        data_type: timestamp
        constraints: [{type: not_null}]

  - name: fct_revenue_v2
    description: "Current version. Breaking change from v1: net_revenue_usd renamed to net_amount_usd; refund_rate added."
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: revenue_key
        data_type: varchar
        constraints: [{type: not_null}, {type: primary_key}]
        tests: [not_null, unique]
      - name: customer_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: transaction_date
        data_type: date
        constraints: [{type: not_null}]
      - name: transaction_count
        data_type: bigint
        constraints: [{type: not_null}]
      - name: refund_count
        data_type: bigint
        constraints: [{type: not_null}]
      - name: gross_revenue_usd
        data_type: double
        constraints: [{type: not_null}]
      - name: refund_amount_usd
        data_type: double
        constraints: [{type: not_null}]
      - name: net_amount_usd
        data_type: double
        description: "Renamed from net_revenue_usd in v1."
        constraints: [{type: not_null}]
      - name: refund_rate
        data_type: double
        description: "refund_count / transaction_count. New in v2."
        constraints: [{type: not_null}]
      - name: last_updated_at
        data_type: timestamp
        constraints: [{type: not_null}]
