version: 2

sources:
  - name: raw_data
    schema: "{{ target.schema }}_raw"
    description: "Raw source seed tables simulating streaming/operational OLTP ingests"
    tables:
      - name: customers_w2
        identifier: raw_customers_w2
        description: "Raw customers table containing customer profile, subscription status and timestamps"
        columns:
          - name: id
            description: "Primary key for customer"
            tests:
              - not_null
              - unique
          - name: name
          - name: email
          - name: subscription_status
          - name: updated_at

      - name: orders_w2
        identifier: raw_orders_w2
        description: "Raw transactions table containing order amounts and dates"
        columns:
          - name: id
            description: "Primary key for order"
            tests:
              - not_null
              - unique
          - name: customer_id
          - name: order_date
          - name: status
          - name: amount
          - name: updated_at
