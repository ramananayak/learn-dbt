name: week2_advanced_incrementals
version: '1.0.0'
config-version: 2

profile: platform_dbt_project

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  week2_advanced_incrementals:
    +schema: raw
    raw_customers_w2:
      +column_types:
        id: varchar
        name: varchar
        email: varchar
        subscription_status: varchar
        updated_at: timestamp
    raw_orders_w2:
      +column_types:
        id: varchar
        customer_id: varchar
        order_date: date
        status: varchar
        amount: numeric(16, 2)
        updated_at: timestamp

models:
  week2_advanced_incrementals:
    staging:
      +materialized: view
    marts:
      +materialized: table
