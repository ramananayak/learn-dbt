name: dbt-slim-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'Code/week3_orchestration_and_ci/dbt_project/**'
      - 'models/**'
      - 'seeds/**'
      - 'snapshots/**'
      - 'macros/**'
      - 'dbt_project.yml'
      - 'packages.yml'

jobs:
  slim-ci-check:
    name: Run dbt Slim CI on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dbt & Adapters
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb dbt-redshift

      - name: Install dbt Packages
        working-directory: ./Code/week3_orchestration_and_ci/dbt_project
        run: |
          dbt deps

      - name: Fetch Baseline State Manifest from S3
        # In enterprise environments, production CI/CD exports manifest.json to an S3 bucket on every merge to main
        run: |
          mkdir -p state_artifacts
          # Example AWS S3 fetch:
          # aws s3 cp s3://company-dbt-metadata/production/manifest.json ./state_artifacts/manifest.json
          # Fallback if testing without S3:
          if [ ! -f ./state_artifacts/manifest.json ]; then
            echo "Generating fallback baseline manifest..."
            cd Code/week3_orchestration_and_ci/dbt_project
            dbt compile --target dev_local --target-path ../../state_artifacts
            cd ../../..
          fi

      - name: Run Slim CI (Modified Models & Downstream Tests)
        working-directory: ./Code/week3_orchestration_and_ci/dbt_project
        env:
          DBT_TARGET: dev_local
          CI_JOB_ID: ${{ github.run_id }}
        run: |
          dbt build \
            --select "state:modified+" \
            --defer \
            --state ../../state_artifacts \
            --target dev_local
